# .github/workflows/ai-auto-build-apk.yml
name: AI Auto Build APK

on:
  push:
    branches:
      - design-suggestion/**
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 完整克隆以避免二进制文件损坏

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🤖 Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: 📦 Verify Gradle Wrapper
      run: |
        echo "=== Verifying Gradle Wrapper ==="
        echo "Gradle version: $(cat gradle/wrapper/gradle-wrapper.properties | grep distributionUrl)"
        echo "Wrapper JAR exists: $([ -f "gradle/wrapper/gradle-wrapper.jar" ] && echo "YES" || echo "NO")"
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "❌ ERROR: gradle-wrapper.jar not found!"
          exit 1
        fi
        if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          echo "❌ ERROR: gradle-wrapper.properties not found!"
          exit 1
        fi
        echo "✅ Gradle wrapper files verified"

    - name: 🇨🇳 Configure Maven repositories
      run: |
        mkdir -p ~/.gradle
        cat > ~/.gradle/init.gradle <<EOF
        allprojects {
          repositories {
            // Aliyun mirrors (fast)
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/central' }
            // Fallback to official repositories
            google()
            mavenCentral()
            maven { url 'https://jitpack.io' }
          }
        }
        EOF

    - name: 🔓 Grant execute permission
      run: chmod +x gradlew

    - name: 🚀 Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"

    - name: 🚀 Build Release APK
      run: ./gradlew assembleRelease --stacktrace --no-daemon
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"

    - name: 📤 Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-v${{ github.run_number }}
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: 📤 Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-v${{ github.run_number }}
        path: app/build/outputs/apk/release/app-release-unsigned.apk

    - name: 🏷️ Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          ## 🎉 AI Auto Build Release

          ### 📦 APK Files
          - Debug: app-debug-v${{ github.run_number }}.apk
          - Release: app-release-v${{ github.run_number }}.apk

          ### 📝 Changes
          - Auto-generated by AI Analysis Service
          - Based on design suggestions

          ### 🔗 Download
          See Artifacts section below.
        draft: false
        prerelease: true
