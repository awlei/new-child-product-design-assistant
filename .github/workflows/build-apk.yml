name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 📦 Install Gradle and generate wrapper
      run: |
        curl -s "https://get.sdkman.io" | bash
        source "$HOME/.sdkman/bin/sdkman-init.sh"
        sdk install gradle 8.2
        gradle wrapper --gradle-version 8.2

    - name: 🔓 Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Sign APK (Optional - requires secrets)
      if: env.SIGNING_KEYSTORE_BASE64 != ''
      env:
        SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: |
        echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
        # 这里可以添加签名逻辑

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30

    - name: Get APK Info
      run: |
        echo "Debug APK size:"
        ls -lh app/build/outputs/apk/debug/app-debug.apk || echo "Debug APK not found"
        echo "Release APK size:"
        ls -lh app/build/outputs/apk/release/app-release-unsigned.apk || echo "Release APK not found"

    - name: Create Release Summary
      run: |
        echo "## 🎉 构建成功！" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 APK 文件" >> $GITHUB_STEP_SUMMARY
        echo "- Debug APK: app-debug.apk" >> $GITHUB_STEP_SUMMARY
        echo "- Release APK: app-release-unsigned.apk" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 下载方式" >> $GITHUB_STEP_SUMMARY
        echo "1. 进入 Actions 标签" >> $GITHUB_STEP_SUMMARY
        echo "2. 选择此构建任务" >> $GITHUB_STEP_SUMMARY
        echo "3. 在 Artifacts 区域下载 APK 文件" >> $GITHUB_STEP_SUMMARY
