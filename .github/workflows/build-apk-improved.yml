name: Build Android APK (Improved)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 📦 Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: 💾 Cache Gradle packages (improved)
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: 📋 Display Gradle info
      run: |
        echo "=== Gradle Version ==="
        ./gradlew --version
        echo ""
        echo "=== Java Version ==="
        java -version

    - name: 🔨 Clean build cache
      run: ./gradlew clean

    - name: 🚀 Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

    - name: 🚀 Build Release APK
      run: ./gradlew assembleRelease --stacktrace --no-daemon
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

    - name: 📊 Get APK Info
      run: |
        echo "=== APK File Information ===" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          DEBUG_SIZE=$(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')
          echo "✅ **Debug APK**" >> $GITHUB_STEP_SUMMARY
          echo "- Size: $DEBUG_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- Path: app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Debug APK not found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
          RELEASE_SIZE=$(ls -lh app/build/outputs/apk/release/app-release-unsigned.apk | awk '{print $5}')
          echo "✅ **Release APK**" >> $GITHUB_STEP_SUMMARY
          echo "- Size: $RELEASE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- Path: app/build/outputs/apk/release/app-release-unsigned.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Release APK not found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

    - name: 📤 Upload Debug APK
      if: hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-v${{ github.run_number }}
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error

    - name: 📤 Upload Release APK
      if: hashFiles('app/build/outputs/apk/release/app-release-unsigned.apk') != ''
      uses: actions/upload-artifact@v4
      with:
        name: app-release-v${{ github.run_number }}
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
        if-no-files-found: error

    - name: ✅ Build Summary
      if: success()
      run: |
        echo "## 🎉 构建成功！" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 构建信息" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build #**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 下载方式" >> $GITHUB_STEP_SUMMARY
        echo "1. 进入 Actions 标签" >> $GITHUB_STEP_SUMMARY
        echo "2. 选择此构建任务" >> $GITHUB_STEP_SUMMARY
        echo "3. 在 Artifacts 区域下载 APK 文件" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 应用信息" >> $GITHUB_STEP_SUMMARY
        echo "- **应用名称**: 儿童产品设计助手" >> $GITHUB_STEP_SUMMARY
        echo "- **版本**: v1.1.0" >> $GITHUB_STEP_SUMMARY
        echo "- **最低 Android**: 7.0 (API 24)" >> $GITHUB_STEP_SUMMARY
        echo "- **目标 Android**: 14 (API 34)" >> $GITHUB_STEP_SUMMARY

    - name: ❌ Build Failure Summary
      if: failure()
      run: |
        echo "## ❌ 构建失败" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 错误信息" >> $GITHUB_STEP_SUMMARY
        echo "请查看构建日志以获取详细错误信息" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 常见问题" >> $GITHUB_STEP_SUMMARY
        echo "- Gradle 依赖下载失败：重试构建" >> $GITHUB_STEP_SUMMARY
        echo "- 编译错误：检查代码语法" >> $GITHUB_STEP_SUMMARY
        echo "- 内存不足：检查 Gradle 配置" >> $GITHUB_STEP_SUMMARY
